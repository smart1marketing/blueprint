databases:
  - name: smart1-sites-db
    databaseName: smart1_sites
    user: smart1
    plan: free            # upgrade to a paid plan for a permanent production database

services:
  - type: web
    name: smart-1-sites-admin
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MOCK_MODE
        value: false
      - key: ENABLE_WRITE_ACTIONS
        value: false
      - key: SIMVOLY_API_BASE_URL
        value: https://api.smart1sites.com
      - key: DATABASE_URL
        fromDatabase:
          name: smart1-sites-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
