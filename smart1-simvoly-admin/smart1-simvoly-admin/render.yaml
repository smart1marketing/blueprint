services:
  - type: web
    name: smart1-simvoly-admin
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: MOCK_MODE
        value: "true"
      - key: SIMVOLY_WL_TIER
        value: advanced
    disk:
      name: smart1-simvoly-data
      mountPath: /var/data
      sizeGB: 1
