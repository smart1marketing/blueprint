{% extends "base.html" %}
{% block title %}Add Site · Smart 1 Sites Admin{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Add a Simvoly Site</h1><p class="muted">Creates the user first, then the project/site using the configured Platform API endpoints.</p></div></div>
<form method="post" class="card form-card">
  <input type="hidden" name="csrf_token" value="{{ session.get('csrf','') }}">
  <div class="grid2">
    <label>Site / Client Name *<input name="site_name" value="{{ form.get('site_name','') }}" required></label>
    <label>Subdomain *<input name="subdomain" value="{{ form.get('subdomain','') }}" placeholder="abc-roofing" required></label>
    <label>First Name *<input name="first_name" value="{{ form.get('first_name','') }}" required></label>
    <label>Last Name *<input name="last_name" value="{{ form.get('last_name','') }}" required></label>
    <label>Email *<input type="email" name="email" value="{{ form.get('email','') }}" required></label>
    <label>Plan *
      <select name="plan" required>
        {% for p in ['starter','premium','elite','ultimate'] %}<option value="{{ p }}" {% if form.get('plan') == p %}selected{% endif %}>{{ p|title }}</option>{% endfor %}
      </select>
    </label>
    <label>Smart 1 Client Price / month<input type="number" step="0.01" min="0" name="retail_price" placeholder="Optional"></label>
  </div>
  <div class="form-actions"><a class="btn ghost" href="{{ url_for('dashboard') }}">Cancel</a><button class="btn primary" type="submit">Create Site</button></div>
</form>
{% endblock %}
