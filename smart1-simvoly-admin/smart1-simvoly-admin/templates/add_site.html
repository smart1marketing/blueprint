{% extends 'base.html' %}{% block content %}<div class="titlebar"><div><h1>Add Site</h1><p>Provisioning form. Live submission stays disabled until create-project configuration is verified.</p></div></div>{% if not settings.enable_write_actions %}<div class="warning">ENABLE_WRITE_ACTIONS=false — safe mode is on.</div>{% endif %}<form class="card formgrid" method="post"><input type="hidden" name="csrf_token" value="{{session.csrf}}"><label>Site name<input name="site_name" required></label><label>Owner email<input name="email" type="email" required></label><label>First name<input name="first_name" required></label><label>Last name<input name="last_name" required></label><label>Plan<select name="plan_id" required>{% for p in plans %}<option value="{{p.plan_id}}">{{p.name}} — {{money(p.monthly_price)}}/mo</option>{% endfor %}</select></label><label>Subdomain<input name="subdomain" required></label><button class="primary" {{'disabled' if not settings.enable_write_actions}}>Create Site</button></form>{% endblock %}
