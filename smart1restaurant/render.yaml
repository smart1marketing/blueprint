services:
  - type: web
    name: smart1restaurant
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 300
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: GHL_WEBHOOK_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: REPORT_NAME
        value: restaurant-market-report
      - key: ENABLE_PDF
        value: "1"
      - key: PDF_RESOURCE_TYPE
        value: image
      - key: PDF_LOGO_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MIN_FILL_SECONDS
        value: "3"
      - key: RATE_LIMIT_MAX
        value: "12"
      - key: RATE_LIMIT_WINDOW_SEC
        value: "60"
      # PUBLIC_BASE_URL powers shareable /r/<id> report links (and the local PDF
      # fallback). Set it to your live Render URL, e.g. https://smart1restaurant.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false
