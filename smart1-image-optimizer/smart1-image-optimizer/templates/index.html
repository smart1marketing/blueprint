<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Optimizer</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(680px,100%);background:white;border-radius:20px;padding:28px;box-shadow:0 14px 45px rgba(20,35,70,.12)}h1{margin:0 0 8px;font-size:30px}p{margin:0 0 22px;color:#5b6475;line-height:1.45}.drop{border:2px dashed #c7cfdd;border-radius:16px;padding:34px 20px;text-align:center;cursor:pointer;background:#fbfcfe}.drop.drag{border-color:#4f6bed;background:#f3f6ff}.drop strong{display:block;font-size:18px;margin-bottom:6px}.drop small{color:#737b8b}.controls{display:flex;gap:12px;align-items:end;margin-top:18px}.field{flex:1}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #d7dce6;border-radius:10px;font-size:16px}button{border:0;border-radius:10px;padding:13px 18px;font-weight:800;background:#172e58;color:#fff;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.status{margin-top:18px;padding:14px;border-radius:12px;background:#f6f8fb;display:none;white-space:pre-line}.status.error{display:block;background:#fff1f1;color:#9c2525}.status.ok{display:block;background:#effaf3;color:#1e6637}@media(max-width:560px){.controls{flex-direction:column;align-items:stretch}.card{padding:20px}}
</style>
</head>
<body>
<main class="card">
  <h1>Image Optimizer</h1>
  <p>Upload a GIF, JPG, JPEG, or PNG. The optimizer will preserve the original format and reduce the file to the target size or smaller.</p>

  <label class="drop" id="dropZone">
    <strong id="fileLabel">Choose an image or drop it here</strong>
    <small>GIF · JPG · JPEG · PNG</small>
    <input id="fileInput" type="file" accept=".gif,.jpg,.jpeg,.png,image/gif,image/jpeg,image/png" hidden>
  </label>

  <div class="controls">
    <div class="field">
      <label for="targetKb">Maximum file size (KB)</label>
      <input id="targetKb" type="number" min="10" max="5000" value="150">
    </div>
    <button id="optimizeBtn" disabled>Optimize & Download</button>
  </div>
  <div id="status" class="status"></div>
</main>
<script>
const fileInput=document.getElementById('fileInput');
const fileLabel=document.getElementById('fileLabel');
const dropZone=document.getElementById('dropZone');
const button=document.getElementById('optimizeBtn');
const statusBox=document.getElementById('status');
const targetKb=document.getElementById('targetKb');

function setFile(file){
  if(!file)return;
  const dt=new DataTransfer();dt.items.add(file);fileInput.files=dt.files;
  fileLabel.textContent=`${file.name} (${(file.size/1024).toFixed(1)} KB)`;
  button.disabled=false;statusBox.className='status';statusBox.textContent='';
}
fileInput.addEventListener('change',()=>setFile(fileInput.files[0]));
['dragenter','dragover'].forEach(evt=>dropZone.addEventListener(evt,e=>{e.preventDefault();dropZone.classList.add('drag')}));
['dragleave','drop'].forEach(evt=>dropZone.addEventListener(evt,e=>{e.preventDefault();dropZone.classList.remove('drag')}));
dropZone.addEventListener('drop',e=>setFile(e.dataTransfer.files[0]));

button.addEventListener('click',async()=>{
  const file=fileInput.files[0];if(!file)return;
  button.disabled=true;button.textContent='Optimizing…';
  statusBox.className='status';statusBox.textContent='';
  const form=new FormData();form.append('file',file);form.append('target_kb',targetKb.value||'150');
  try{
    const res=await fetch('/api/optimize',{method:'POST',body:form});
    if(!res.ok){const err=await res.json().catch(()=>({error:'Optimization failed.'}));throw new Error(err.error||'Optimization failed.');}
    const blob=await res.blob();
    const disposition=res.headers.get('Content-Disposition')||'';
    const match=disposition.match(/filename="?([^";]+)"?/i);
    const filename=match?match[1]:`optimized-${file.name}`;
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
    const original=Number(res.headers.get('X-Original-Bytes')||file.size);
    const optimized=Number(res.headers.get('X-Optimized-Bytes')||blob.size);
    const savings=res.headers.get('X-Savings-Percent')||(((1-optimized/original)*100).toFixed(1));
    statusBox.className='status ok';
    statusBox.textContent=`Done: ${(original/1024).toFixed(1)} KB → ${(optimized/1024).toFixed(1)} KB\nSaved ${savings}%`;
  }catch(err){statusBox.className='status error';statusBox.textContent=err.message;}
  finally{button.disabled=false;button.textContent='Optimize & Download';}
});
</script>
</body>
</html>
