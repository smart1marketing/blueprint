<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart 1 Proposal Builder — Embed</title>
<style>
  html,body{margin:0;height:100%;background:#f3f6f9;font-family:Arial,Helvetica,sans-serif}
  .frame-wrap{position:fixed;inset:0}
  iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
  <!--
  ============================================================
  SMART 1 PROPOSAL BUILDER — EMBED
  ------------------------------------------------------------
  1) Publish this repo with GitHub Pages (see README.md).
  2) Replace the src below with your Pages URL, e.g.
     https://YOURUSERNAME.github.io/smart1-proposal-builder/
  3) To embed in Simvoly (or any site), add an "Embed / Custom
     HTML" element and paste ONLY this iframe snippet:

     <iframe
       src="https://YOURUSERNAME.github.io/smart1-proposal-builder/"
       title="Smart 1 Proposal Builder"
       style="width:100%;height:90vh;min-height:760px;border:0;display:block"
       loading="lazy"></iframe>

  This standalone page is also hostable on its own if you'd
  rather point Simvoly at embed.html instead of the snippet.
  ============================================================
  -->
  <div class="frame-wrap">
    <iframe
      src="./index.html"
      title="Smart 1 Proposal Builder"
      loading="lazy"></iframe>
  </div>
</body>
</html>
