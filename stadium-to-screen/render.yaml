# Render Blueprint. New + > Blueprint > connect this repo.
# Then paste the secret values (marked sync:false) in the Render dashboard.
services:
  - type: web
    name: stadium-to-screen
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: GHL_WEBHOOK_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: ADMIN_TOKEN
        sync: false   # token to view the /leads dashboard
      - key: NOTIFY_WEBHOOK_URL
        sync: false   # instant rep notification (Slack/generic)
      - key: SMTP_URL
        sync: false   # auto-email prospect their PDF
      - key: MAIL_FROM
        sync: false
      - key: REP_NAME
        sync: false
      - key: REP_EMAIL
        sync: false
      - key: REP_PHONE
        sync: false
      - key: CALENDAR_URL
        sync: false   # "Book a strategy call" link
