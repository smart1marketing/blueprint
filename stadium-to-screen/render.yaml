# Render Blueprint. New + > Blueprint > connect this repo.
# Then paste the secret values (marked sync:false) in the Render dashboard.
services:
  - type: web
    name: stadium-to-screen
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: GHL_WEBHOOK_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: ALLOWED_ORIGIN
        value: "*"
