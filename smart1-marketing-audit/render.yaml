services:
  - type: web
    name: smart1-marketing-audit
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false          # set this in the Render dashboard, never in git
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: LEAD_WEBHOOK_URL
        sync: false          # optional: Zapier / Make / Smart 1 Suite endpoint
