services:
  - type: web
    name: knack-creative-lookup
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    
    envVars:
      - key: REACT_APP_KNACK_API_KEY
        scope: build
        sync: false
      - key: REACT_APP_KNACK_IO_OBJECT_ID
        scope: build
        sync: false
      - key: NODE_ENV
        value: production
    
    # Auto-deploy on push to main
    autoDeploy: true
